services:
  timetable:
    build: .
    image: timetable-pntc:latest
    container_name: timetable-pntc
    ports:
      - "80:3000"
    volumes:
      - timetable-data:/app/backend/data
      - timetable-output:/app/backend/output
    restart: unless-stopped

volumes:
  timetable-data:
  timetable-output:
